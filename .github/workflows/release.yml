name: Release

# Push a tag like v1.0.0 to build, sign, notarize and publish a GitHub release.
# Required repository secrets (Settings → Secrets and variables → Actions) are listed in RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0). Builds a draft release."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15   # Apple silicon
    timeout-minutes: 45
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # build number = commit count

      - name: Test
        run: make test

      - name: Import signing certificates
        env:
          DEVELOPER_ID_APP_P12: ${{ secrets.DEVELOPER_ID_APP_P12 }}
          DEVELOPER_ID_INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          if [ -z "$DEVELOPER_ID_APP_P12" ]; then
            echo "::warning::No signing certificates configured; building an unsigned release."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          for var in DEVELOPER_ID_APP_P12 DEVELOPER_ID_INSTALLER_P12; do
            [ -n "${!var}" ] || continue
            echo "${!var}" | base64 --decode > "$RUNNER_TEMP/$var.p12"
            security import "$RUNNER_TEMP/$var.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
            rm "$RUNNER_TEMP/$var.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          APP_ID=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          INST_ID=$(security find-identity -v "$KEYCHAIN" | grep -o '"Developer ID Installer: [^"]*"' | head -1 | tr -d '"')
          echo "APP_IDENTITY=$APP_ID" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$INST_ID" >> "$GITHUB_ENV"
          echo "Signing as: $APP_ID / $INST_ID"

      - name: Notary credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::warning::No notary API key configured; the release won't be notarized."
            exit 0
          fi
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY"
          {
            echo "APPLE_API_KEY_PATH=$KEY"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        run: ./Scripts/release.sh "$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${VERSION#v}"
          NOTES="$RUNNER_TEMP/notes.md"
          # Use this version's CHANGELOG section as the release notes.
          awk -v v="$V" '$0 ~ "^## \\[?"v"\\]?" {p=1; next} /^## / && p {exit} p' CHANGELOG.md > "$NOTES"
          [ -s "$NOTES" ] || echo "MacTiles $V" > "$NOTES"
          DRAFT=""
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && DRAFT="--draft"
          gh release create "v$V" build/release/* --title "MacTiles $V" --notes-file "$NOTES" $DRAFT

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
