name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15   # Apple silicon
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for personal data and secrets
        run: ./Scripts/privacy-check.sh
      - name: Test
        run: make test
      - name: Compile the App Store edition (meTiles)
        run: swift build -c release --arch arm64 -Xswiftc -DAPPSTORE --scratch-path "$RUNNER_TEMP/appstore-build"
      - name: Build unsigned installer
        run: ./Scripts/release.sh 0.0.0-ci
      - uses: actions/upload-artifact@v7
        with:
          name: MacTiles-unsigned
          path: build/release/
