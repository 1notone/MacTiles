name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: macos-15   # Apple silicon
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for personal data and secrets
        run: ./Scripts/privacy-check.sh
      - name: Test
        run: make test
      - name: Build unsigned installer
        run: ./Scripts/release.sh 0.0.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: MacTiles-unsigned
          path: build/release/
